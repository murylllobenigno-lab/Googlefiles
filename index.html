<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Desdobramento de Palpites</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eaf0f6;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #1a3c6b;
      text-align: center;
      margin-bottom: 30px;
    }
    .grupo {
      background: #ffffff;
      border-left: 6px solid #1a3c6b;
      padding: 15px 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
      color: #1a3c6b;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .botoes {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background-color: #005fa3;
    }
    .resultado {
      background: #ffffff;
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
      color: #333;
      font-size: 15px;
    }
    .comb {
      border-bottom: 1px dashed #ccc;
      margin-bottom: 12px;
      padding-bottom: 8px;
    }
    .t1 { color: #c0392b; }
    .t2 { color: #27ae60; }
    .t3 { color: #2980b9; }
  </style>
</head>
<body>

  <h1>MURYLLO APP</h1>

  <div class="grupo">
    <label for="time1">Time 1:</label>
    <input type="text" id="time1" placeholder="Ex: Flamengo">
    <label for="palpites1">Palpites (separados por vírgula):</label>
    <input type="text" id="palpites1" placeholder="Ex: 1x0, 2x1, 3x2">
  </div>

  <div class="grupo">
    <label for="time2">Time 2:</label>
    <input type="text" id="time2" placeholder="Ex: Palmeiras">
    <label for="palpites2">Palpites (separados por vírgula):</label>
    <input type="text" id="palpites2" placeholder="Ex: 0x0, 2x2">
  </div>

  <div class="grupo">
    <label for="time3">Time 3:</label>
    <input type="text" id="time3" placeholder="Ex: São Paulo">
    <label for="palpites3">Palpites (separados por vírgula):</label>
    <input type="text" id="palpites3" placeholder="Ex: 1x0, 3x1, 0x1">
  </div>

  <div class="botoes">
    <button onclick="gerarDesdobramento()">Gerar</button>
    <button onclick="copiarResultado()">Copiar</button>
    <button onclick="imprimirResultado()">Imprimir</button>
  </div>

  <div class="resultado" id="resultado"></div>

  <script>
    function gerarDesdobramento() {
      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = "";

      const time1 = document.getElementById("time1").value.trim() || "Time 1";
      const time2 = document.getElementById("time2").value.trim() || "Time 2";
      const time3 = document.getElementById("time3").value.trim() || "Time 3";

      const palpites1 = document.getElementById("palpites1").value.split(",").map(p => p.trim()).filter(p => p);
      const palpites2 = document.getElementById("palpites2").value.split(",").map(p => p.trim()).filter(p => p);
      const palpites3 = document.getElementById("palpites3").value.split(",").map(p => p.trim()).filter(p => p);

      if (!palpites1.length || !palpites2.length || !palpites3.length) {
        resultadoDiv.innerHTML = "<strong>Preencha todos os palpites corretamente.</strong>";
        return;
      }

      let resultado = `<strong>Total de combinações: ${palpites1.length * palpites2.length * palpites3.length}</strong>\n\n`;
      let contador = 0;

      for (let p1 of palpites1) {
        for (let p2 of palpites2) {
          for (let p3 of palpites3) {
            contador++;
            resultado += `<div class="comb"><strong>Combinação ${contador}:</strong><br>
              <span class="t1">${time1}</span>: ${p1}<br>
              <span class="t2">${time2}</span>: ${p2}<br>
              <span class="t3">${time3}</span>: ${p3}</div>`;
          }
        }
      }

      resultadoDiv.innerHTML = resultado;
    }

    function copiarResultado() {
      const texto = document.getElementById("resultado").innerText;
      navigator.clipboard.writeText(texto).then(() => {
        alert("Palpites copiados com sucesso!");
      }).catch(err => {
        alert("Erro ao copiar: " + err);
      });
    }

    function imprimirResultado() {
      const conteudo = document.getElementById("resultado").innerHTML;
      const janela = window.open("", "_blank");
      janela.document.write("<html><head><title>Impressão</title></head><body>");
      janela.document.write("<div style='font-family:Arial;padding:20px'>" + conteudo + "</div>");
      janela.document.write("</body></html>");
      janela.document.close();
      janela.print();
    }
  </script>

</body>
</html>
